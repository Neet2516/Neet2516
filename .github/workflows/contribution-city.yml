name: GitHub Profile 3D Contrib City

on:
  schedule:
    - cron: '0 18 * * *' # Runs daily at 18:00 UTC (23:30 IST)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/contribution-city.yml'

permissions:
  contents: write

jobs:
  build:
    name: Generate 3D Contribution City
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Neet2516

      - name: Commit & Push Generated City
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --staged --quiet; then
            echo "No changes in 3D contribution graph to commit."
          else
            git commit -m "chore(telemetry): update 3d contribution city visualization [skip ci]"
            git push
          fi

